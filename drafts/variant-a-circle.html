<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USBOARD GROUP — 案A:サークル型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@300;400;500;700&family=Barlow+Condensed:ital,wght@0,500;0,600;1,600;1,700&family=Barlow:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  /* --- 案A: サークル型ポートレート --- */
  .draft-banner { background:#6d3ff0; color:#fff; text-align:center; font-size:13px; letter-spacing:.05em; padding:10px; position:sticky; top:0; z-index:100; }
  .draft-banner a { color:#fff; text-decoration:underline; }

  .message-intro--a {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: clamp(72px,9vw,120px) clamp(20px,4vw,48px) clamp(56px,7vw,90px);
  }
  .message-photo--circle {
    width: clamp(180px, 22vw, 260px);
    height: clamp(180px, 22vw, 260px);
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    margin-bottom: 32px;
    box-shadow: 0 0 0 6px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.5);
  }
  .message-photo--circle::before {
    content:'';
    position:absolute; inset:-4px;
    border-radius:50%;
    background: linear-gradient(135deg,#f2a33c,#e8437c 32%,#7b45f0 58%,#2e9bd6 80%,#4fbf6d);
    z-index:0;
  }
  .message-photo--circle img {
    position:absolute; inset:3px;
    width:calc(100% - 6px); height:calc(100% - 6px);
    border-radius:50%;
    object-fit:cover;
    object-position: center 25%;
    z-index:1;
  }
</style>
</head>
<body>

<div class="draft-banner">案A: サークル型ポートレート &mdash; <a href="./">他の案を見る</a></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="#top" class="logo">
      <img class="logo-img" src="../assets/img/UBロゴ.png" alt="USBOARD GROUP">
    </a>
    <nav class="main-nav">
      <a href="#message">代表メッセージ</a>
    </nav>
  </div>
  <div class="gradient-bar"></div>
</header>

<section id="message" class="message-section">
  <div class="message-intro message-intro--a">
    <div class="message-photo--circle">
      <img src="../assets/img/代表写真ポップ.jpg" alt="代表取締役 山下克則">
    </div>
    <div class="eyebrow eyebrow--light">03 &mdash; MESSAGE</div>
    <h2 class="section-title section-title--light">代表メッセージ</h2>
    <div class="message-kicker">message</div>
  </div>

  <div class="wrap message-body">
    <h3 class="message-quote-title">業界の&quot;当たり前&quot;を変える。</h3>
    <div class="message-text">
      <p>私たちUSBOARDグループが目指しているのは、会社を大きくすることだけではありません。<br>本当に実現したいのは、「業界のスタンダード」を変えることです。</p>
      <blockquote>コピーされることは、競争に負けることではありません。</blockquote>
      <div class="message-sign">
        <span class="message-sign-label">代表取締役</span>
        <img class="message-sign-img" src="../assets/img/signature-cropped.png" alt="山下克則 署名">
      </div>
    </div>
  </div>
</section>

</body>
</html>
