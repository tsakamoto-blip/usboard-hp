<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USBOARD GROUP — 案B:フレーム型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@300;400;500;700&family=Barlow+Condensed:ital,wght@0,500;0,600;1,600;1,700&family=Barlow:wght@400;500&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  /* --- 案B: フレームカード型ポートレート --- */
  .draft-banner { background:#6d3ff0; color:#fff; text-align:center; font-size:13px; letter-spacing:.05em; padding:10px; position:sticky; top:0; z-index:100; }
  .draft-banner a { color:#fff; text-decoration:underline; }

  .message-intro--b {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
    align-items: center;
    gap: clamp(32px, 5vw, 64px);
    padding: clamp(64px, 8vw, 100px) clamp(24px, 5vw, 90px);
  }
  .message-photo--framed {
    position: relative;
    aspect-ratio: 4 / 5;
    max-width: 420px;
    margin: 0 auto;
    border: 1px solid rgba(255,255,255,0.14);
    padding: 14px;
  }
  .message-photo--framed::before {
    content:'';
    position:absolute; left:14px; top:14px; right:-14px; bottom:-14px;
    border: 1px solid rgba(255,255,255,0.14);
    z-index: 0;
  }
  .message-photo--framed .frame-inner {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
  }
  .message-photo--framed img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: grayscale(1) contrast(1.05);
  }
  .message-heading--b {
    text-align: left;
  }
</style>
</head>
<body>

<div class="draft-banner">案B: フレームカード型ポートレート(白黒・二重枠) &mdash; <a href="./">他の案を見る</a></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="#top" class="logo">
      <img class="logo-img" src="../assets/img/UBロゴ.png" alt="USBOARD GROUP">
    </a>
    <nav class="main-nav">
      <a href="#message">代表メッセージ</a>
    </nav>
  </div>
  <div class="gradient-bar"></div>
</header>

<section id="message" class="message-section">
  <div class="wrap message-intro--b">
    <div class="message-photo--framed">
      <div class="frame-inner">
        <img src="../assets/img/代表写真.jpg" alt="代表取締役 山下克則">
      </div>
    </div>
    <div class="message-heading--b">
      <div class="eyebrow eyebrow--light">03 &mdash; MESSAGE</div>
      <h2 class="section-title section-title--light">代表メッセージ</h2>
      <div class="message-kicker">message</div>
    </div>
  </div>

  <div class="wrap message-body">
    <h3 class="message-quote-title">業界の&quot;当たり前&quot;を変える。</h3>
    <div class="message-text">
      <p>私たちUSBOARDグループが目指しているのは、会社を大きくすることだけではありません。<br>本当に実現したいのは、「業界のスタンダード」を変えることです。</p>
      <blockquote>コピーされることは、競争に負けることではありません。</blockquote>
      <div class="message-sign">
        <span class="message-sign-label">代表取締役</span>
        <img class="message-sign-img" src="../assets/img/signature-cropped.png" alt="山下克則 署名">
      </div>
    </div>
  </div>
</section>

</body>
</html>
